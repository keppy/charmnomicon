name = "charmnomicon"
main = "src/index.js"
compatibility_date = "2025-09-01"
# Served only at charmnomicon.com (www redirects to it). workers.dev stays off so the site has one origin:
# every catalog listing, the MCP URL, and hosted-app sandbox CSPs all name that origin.
workers_dev = false
preview_urls = false
routes = [
  { pattern = "charmnomicon.com", custom_domain = true },
  { pattern = "www.charmnomicon.com", custom_domain = true },
]
# Free tier friendly: no Durable Objects, no KV, no R2. Everything lives in one D1 database.

# Moderation cron (src/moderation.js): Llama Guard over new content every 10 minutes.
[triggers]
crons = ["*/10 * * * *"]

[ai]
binding = "AI"

[observability]
enabled = true

[vars]
# The request origin is used for every absolute URL. Locally, .dev.vars sets PUBLIC_ORIGIN=http://localhost:8787
# because `wrangler dev` rewrites the request host to the first route.
READ_ONLY = "0"
# Public half of the MCP Registry domain-auth key (private key: .mcp-registry-key.pem, gitignored).
MCP_REGISTRY_AUTH = "v=MCPv1; k=ed25519; p=9GnQCgEYHKODrkT28Trt3ZOn7Ir8zg0DosYb79TI+3w="
REPORT_THRESHOLD = "3"
# Featured charms lead the home page, in this order (comma-separated slugs). Edit and redeploy to change them.
FEATURED = "goat-in-the-water,hang-on-grasshopper,downton-dog,cult-of-the-cosmic-frog"
# Secrets (set with `npx wrangler secret put NAME`): ADMIN_TOKEN, IP_SALT

# Bundle the social preview image as a binary module (src/index.js imports it).
[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "charmnomicon"
database_id = "7af8e7cb-2fef-4533-b9b8-6ad3e5aab36a"
migrations_dir = "migrations"
