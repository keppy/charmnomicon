name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-packages.mjs --check
      # The Workers AI binding is always remote and needs Cloudflare credentials; CI has none and the
      # moderation tests use MODERATION_FAKE=1 instead, so run from a copy of the config without [ai].
      - name: ci config without the remote AI binding
        run: |
          sed '/^\[ai\]/,/^$/d' wrangler.toml > wrangler.ci.toml
          ! grep -q '^\[ai\]' wrangler.ci.toml
      - run: cp .dev.vars.example .dev.vars && npx wrangler d1 migrations apply charmnomicon --local -c wrangler.ci.toml
      - name: start worker
        run: |
          npx wrangler dev -c wrangler.ci.toml --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8787/api >/dev/null && exit 0; sleep 1; done
          cat wrangler.log; exit 1
      - run: node scripts/seed.mjs
      - run: node scripts/smoke.mjs
        env:
          CHARM_WRANGLER_CONFIG: wrangler.ci.toml
      - run: CHROME=/usr/bin/google-chrome node scripts/browser-check.mjs
      - run: CHROME=/usr/bin/google-chrome node scripts/mobile-check.mjs
      - if: failure()
        run: cat wrangler.log
